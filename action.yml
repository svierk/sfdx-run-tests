name: SFDX Run Tests
description: GitHub composite action to run Salesforce Apex, LWC, Flow and Agentforce agent tests with code coverage reporting.

branding:
  icon: check-square
  color: blue

inputs:
  apex:
    description: Run Apex tests.
    required: false
    default: 'true'
  lwc:
    description: Run LWC (Jest) unit tests.
    required: false
    default: 'false'
  flow:
    description: Run Flow tests.
    required: false
    default: 'false'
  agent:
    description: >
      Run Agentforce agent tests. The tests of the project are found by their metadata files
      (AiEvaluationDefinition, AiTestingDefinition); a project without any is skipped. They have to be
      deployed and their agents active in the target org. Agent tests consume Einstein Requests or Flex
      Credits and can change org data, so they are opt-in.
    required: false
    default: 'false'
  target-org:
    description: Username or alias of the target org (used for Apex, Flow and agent tests). Not required if the default org is already set.
    required: false
  test-level:
    description: >
      Test level for Apex and Flow tests. Permissible values: RunLocalTests, RunAllTestsInOrg, RunSpecifiedTests.
      RunSpecifiedTests requires a test selection (see the apex-* and flow-* selection inputs). A test type with a
      selection always runs with RunSpecifiedTests, so a selection can be combined with another level for the other type.
    required: false
    default: RunLocalTests
  apex-class-names:
    description: >
      Apex test classes to run, as a comma-separated or multi-line list, e.g. "AccountServiceTest,LeadServiceTest".
      Runs all test methods of the given classes. Only one of apex-class-names, apex-suite-names or apex-tests can be set.
    required: false
  apex-suite-names:
    description: >
      Apex test suites to run, as a comma-separated or multi-line list, e.g. "SmokeTests".
      Only one of apex-class-names, apex-suite-names or apex-tests can be set.
    required: false
  apex-tests:
    description: >
      Apex tests to run, as a comma-separated or multi-line list of classes or Class.method names,
      e.g. "AccountServiceTest.testCreate,LeadServiceTest". Use ns.Class.method for namespaced tests.
      Only one of apex-class-names, apex-suite-names or apex-tests can be set.
    required: false
  flow-class-names:
    description: >
      Flows whose flow tests should run, as a comma-separated or multi-line list of flow API names, e.g. "Create_Case,Update_Account".
      Flows without a flow test in the project (*.flowtest-meta.xml) are left out with a warning; if none is left, the Flow tests
      are skipped. Only one of flow-class-names or flow-tests can be set.
    required: false
  flow-tests:
    description: >
      Individual flow tests to run, as a comma-separated or multi-line list of FlowName.TestName entries,
      e.g. "Create_Case.Happy_Path". Only one of flow-class-names or flow-tests can be set.
    required: false
  agent-tests:
    description: >
      Agent tests to run instead of all tests of the project, as a comma-separated or multi-line list of API names,
      e.g. "Service_Agent_Smoke,Service_Agent_Regression". Tests that only exist in the org can be named here as well.
    required: false
  code-coverage:
    description: Collect code coverage for Apex and Flow tests.
    required: false
    default: 'true'
  apex-output-dir:
    description: Directory for Apex test result and coverage files. Contains test-result-codecoverage.json for Sonar.
    required: false
    default: ./tests/apex
  flow-output-dir:
    description: Directory for Flow test result and coverage files.
    required: false
    default: ./tests/flow
  agent-output-dir:
    description: Directory for the agent test results, one JUnit file per test.
    required: false
    default: ./tests/agent
  lwc-test-command:
    description: >
      Command used to run the LWC Jest tests with coverage (must write an lcov report).
      Defaults to invoking sfdx-lwc-jest directly so it works on any SFDX project without
      relying on a specific package.json script. Override it to use your own test script,
      e.g. "npm run test:unit:coverage".
    required: false
    default: npx sfdx-lwc-jest --coverage
  lwc-lcov-path:
    description: Path to the lcov report produced by the LWC tests, used to report overall coverage.
    required: false
    default: ./coverage/lcov.info
  wait:
    description: Number of minutes to wait for each Apex, Flow and agent test run to complete.
    required: false
    default: '33'
  api-version:
    description: Override the api version used for Apex, Flow and agent test api requests, for example '68.0'.
    required: false
  step-summary:
    description: Write a result section to the GitHub Actions job summary. Set to false to avoid collisions with a custom workflow summary.
    required: false
    default: 'true'

outputs:
  apex-outcome:
    description: Outcome of the Apex test run ("Passed"/"Failed", or "Skipped" when the org has no Apex tests to run), empty if not run.
    value: ${{ steps.tests.outputs.apex-outcome }}
  apex-coverage:
    description: Overall Apex code coverage, empty if not run.
    value: ${{ steps.tests.outputs.apex-coverage }}
  lwc-outcome:
    description: Outcome of the LWC test run ("Passed"/"Failed", or "Skipped" when the project has no Jest tests), empty if not run.
    value: ${{ steps.tests.outputs.lwc-outcome }}
  lwc-coverage:
    description: Overall LWC line coverage, empty if not run.
    value: ${{ steps.tests.outputs.lwc-coverage }}
  flow-outcome:
    description: Outcome of the Flow test run ("Passed"/"Failed", or "Skipped" when there are no flow tests to run), empty if not run.
    value: ${{ steps.tests.outputs.flow-outcome }}
  flow-coverage:
    description: Overall Flow code coverage, empty if not run.
    value: ${{ steps.tests.outputs.flow-coverage }}
  agent-outcome:
    description: Outcome of the agent test runs ("Passed"/"Failed", or "Skipped" when the project has no agent tests), empty if not run.
    value: ${{ steps.tests.outputs.agent-outcome }}

runs:
  using: composite
  steps:
    - name: Run Tests
      id: tests
      shell: bash
      env:
        APEX: ${{ inputs.apex }}
        LWC: ${{ inputs.lwc }}
        FLOW: ${{ inputs.flow }}
        AGENT: ${{ inputs.agent }}
        TARGET_ORG: ${{ inputs.target-org }}
        TEST_LEVEL: ${{ inputs.test-level }}
        APEX_CLASS_NAMES: ${{ inputs.apex-class-names }}
        APEX_SUITE_NAMES: ${{ inputs.apex-suite-names }}
        APEX_TESTS: ${{ inputs.apex-tests }}
        FLOW_CLASS_NAMES: ${{ inputs.flow-class-names }}
        FLOW_TESTS: ${{ inputs.flow-tests }}
        AGENT_TESTS: ${{ inputs.agent-tests }}
        CODE_COVERAGE: ${{ inputs.code-coverage }}
        APEX_OUTPUT_DIR: ${{ inputs.apex-output-dir }}
        FLOW_OUTPUT_DIR: ${{ inputs.flow-output-dir }}
        AGENT_OUTPUT_DIR: ${{ inputs.agent-output-dir }}
        LWC_TEST_COMMAND: ${{ inputs.lwc-test-command }}
        LWC_LCOV_PATH: ${{ inputs.lwc-lcov-path }}
        WAIT: ${{ inputs.wait }}
        API_VERSION: ${{ inputs.api-version }}
        STEP_SUMMARY: ${{ inputs.step-summary }}
      run: |
        set -uo pipefail

        # We manage the exit status ourselves via `overall_exit`, so disable
        # errexit (GitHub runs composite shells with `-e` by default). This
        # guarantees that a failure in one test type still lets the remaining
        # types run and the job summary render before we exit with the
        # aggregated status.
        set +e

        overall_exit=0

        # Extract the JSON object from CLI output that may be prefixed with
        # npm/plugin JIT-install noise (some of which contains "{"). Keeps
        # everything from the first line that starts with "{".
        extract_json() { awk '/^[[:space:]]*\{/{f=1} f'; }

        # Splits a comma- or newline-separated input into the global SPLIT array
        # and trims the surrounding whitespace, so that both notations work:
        #   apex-tests: 'AccountServiceTest,LeadServiceTest'
        #   apex-tests: |
        #     AccountServiceTest
        #     LeadServiceTest
        split_list() {
          SPLIT=()
          local raw item
          raw="${1//,/$'\n'}"
          while IFS= read -r item; do
            item="${item#"${item%%[![:space:]]*}"}"
            item="${item%"${item##*[![:space:]]}"}"
            if [[ -n "$item" ]]; then
              SPLIT+=("$item")
            fi
          done <<< "$raw"
        }

        # Builds the test selection of one test type from its list inputs: fills
        # the global SELECTION array with one CLI flag per value and sets
        # SELECTION_LEVEL to the test level to run with. A selection implies
        # RunSpecifiedTests; without one, the `test-level` input applies.
        # Returns 1 (after logging the reason) if more than one selection input
        # is set - the CLI accepts only one kind - or if RunSpecifiedTests is
        # requested without any selection.
        # Usage: select_tests "<label>" "<input>" "<flag>" "<value>" [...]
        select_tests() {
          local label="$1" inputs="" used="" count=0 item
          shift
          SELECTION=()
          SELECTION_LEVEL="$TEST_LEVEL"
          while [[ $# -ge 3 ]]; do
            inputs+="${inputs:+, }'$1'"
            split_list "$3"
            if [[ ${#SPLIT[@]} -gt 0 ]]; then
              count=$(( count + 1 ))
              used+="${used:+, }'$1'"
              for item in "${SPLIT[@]}"; do
                SELECTION+=("$2" "$item")
              done
            fi
            shift 3
          done

          if [[ $count -gt 1 ]]; then
            echo "::error::${label} test selection is ambiguous: ${used} are set, but only one of them can be used."
            return 1
          fi
          if [[ $count -eq 1 ]]; then
            SELECTION_LEVEL=RunSpecifiedTests
          elif [[ "$TEST_LEVEL" == "RunSpecifiedTests" ]]; then
            echo "::error::Test level RunSpecifiedTests needs a selection of the ${label} tests to run. Set one of ${inputs}."
            return 1
          fi
        }

        # Map a test outcome to a status icon for the job summary. Anything other
        # than a clean "Passed" (including an empty outcome from a run that never
        # completed) is treated as not-passing.
        outcome_icon() {
          case "$1" in
            Passed) printf '✅' ;;
            Failed) printf '❌' ;;
            *)      printf '⚠️' ;;
          esac
        }

        # Make sure the flow plugin (used to run Flow tests) is available. It is
        # a JIT plugin whose first-use install dumps npm warnings onto stdout;
        # installing it up front keeps that noise out of the captured JSON. If a
        # previous step already installed it, the check skips reinstalling. The
        # install output is captured and only surfaced on failure to keep the
        # log clean. `flow` also appears under "Uninstalled JIT Plugins:", so
        # only the installed section (above that header) is inspected.
        ensure_flow() {
          if sf plugins 2>/dev/null | sed '/Uninstalled JIT Plugins:/,$d' | grep -q '^flow '; then
            return 0
          fi
          echo "Installing flow plugin..."
          local log
          if ! log="$(sf plugins install flow 2>&1)"; then
            echo "$log"
            echo "::error::Failed to install the flow plugin."
            return 1
          fi
        }

        # Render an `sf ... test --json` payload the way Jest reports its runs:
        # a collapsible log group with one line per test plus a readable run
        # summary. Any failures are repeated OUTSIDE the group (with message and
        # stack trace) so they are visible without expanding anything.
        # Usage: render_test_results "<label>" "<json>"
        render_test_results() {
          local label="$1" json="$2"

          if ! echo "$json" | jq -e . >/dev/null 2>&1; then
            echo "⚠️ ${label}: the CLI returned unexpected non-JSON output:"
            echo "$json"
            return 0
          fi

          echo "::group::${label} results"
          echo "$json" | jq -r '
            def name: .FullName // "\(.ApexClass.Name // "?").\(.MethodName // "?")";
            (.result.tests // []) as $t
            | (if ($t | length) == 0 then ["(no individual test results returned)"]
               else [$t[]
                     | if .Outcome == "Pass" then "✓ \(name) (\(.RunTime // 0) ms)"
                       elif .Outcome == "Skip" then "○ \(name) (skipped)"
                       else "✗ \(name) (\(.RunTime // 0) ms)"
                       end]
               end)
            + ["",
               (.result.summary // {}
                | "Outcome:            \(.outcome // "-")",
                  "Tests ran:          \(.testsRan // "-")",
                  "Passing:            \(.passing // 0)",
                  "Failing:            \(.failing // 0)",
                  "Skipped:            \(.skipped // 0)",
                  "Pass rate:          \(.passRate // "-")",
                  "Run time:           \(.testExecutionTime // "-")",
                  "Org-wide coverage:  \(.orgWideCoverage // "-")",
                  "Test run coverage:  \(.testRunCoverage // "-")",
                  "Test run ID:        \(.testRunId // "-")",
                  "Org:                \(.hostname // "-")",
                  "Username:           \(.username // "-")")]
            | .[]'
          echo "::endgroup::"

          echo "$json" | jq -r '
            def name: .FullName // "\(.ApexClass.Name // "?").\(.MethodName // "?")";
            (.result.tests // [])
            | map(select(.Outcome != "Pass" and .Outcome != "Skip"))
            | .[]
            | "❌ \(name): \((.Message // "Test failed") | gsub("\n"; " "))"
              + (if (.StackTrace // "") != "" then "\n   \(.StackTrace | gsub("\n"; "\n   "))" else "" end)'
        }

        apex_outcome=""; apex_coverage=""; apex_passing=""; apex_failing=""
        lwc_outcome=""; lwc_coverage=""
        flow_outcome=""; flow_coverage=""
        agent_outcome=""; agent_detail=""

        # --------------------------- Test selection ---------------------------
        # Resolve the selection of every enabled test type up front, so that a
        # misconfiguration fails fast instead of after a long Apex test run.
        selection_ok=true
        apex_selection=(); apex_level="$TEST_LEVEL"
        flow_selection=(); flow_level="$TEST_LEVEL"
        if [[ "$APEX" == "true" ]]; then
          if select_tests "Apex" \
            apex-class-names --class-names "$APEX_CLASS_NAMES" \
            apex-suite-names --suite-names "$APEX_SUITE_NAMES" \
            apex-tests --tests "$APEX_TESTS"; then
            apex_selection=(${SELECTION[@]+"${SELECTION[@]}"})
            apex_level="$SELECTION_LEVEL"
          else
            selection_ok=false
          fi
        fi
        if [[ "$FLOW" == "true" ]]; then
          if select_tests "Flow" \
            flow-class-names --class-names "$FLOW_CLASS_NAMES" \
            flow-tests --tests "$FLOW_TESTS"; then
            flow_selection=(${SELECTION[@]+"${SELECTION[@]}"})
            flow_level="$SELECTION_LEVEL"
          else
            selection_ok=false
          fi
        fi
        [[ "$selection_ok" == "true" ]] || exit 1

        # ----------------------------- Apex tests -----------------------------
        if [[ "$APEX" == "true" ]]; then
          echo "▶️ Running Apex tests ($apex_level)..."
          apex_args=(--test-level "$apex_level" --output-dir "$APEX_OUTPUT_DIR" --wait "$WAIT")
          apex_args+=(${apex_selection[@]+"${apex_selection[@]}"})
          [[ "$CODE_COVERAGE" == "true" ]] && apex_args+=(--code-coverage)
          [[ -n "$TARGET_ORG" ]] && apex_args+=(--target-org "$TARGET_ORG")
          [[ -n "$API_VERSION" ]] && apex_args+=(--api-version "$API_VERSION")

          # Capture the CLI exit code explicitly (non-zero means the run reported
          # test failures) so we can record it and still continue to the summary.
          apex_result=$(sf apex run test "${apex_args[@]}" --json) && code=0 || code=$?
          apex_result=$(printf '%s\n' "$apex_result" | extract_json)
          render_test_results "Apex test" "$apex_result"

          summary=$(echo "$apex_result" | jq '.result.summary // {}' 2>/dev/null)
          apex_outcome=$(echo "$summary" | jq -r '.outcome // empty')
          apex_passing=$(echo "$summary" | jq -r '.passing // empty')
          apex_failing=$(echo "$summary" | jq -r '.failing // empty')
          apex_coverage=$(echo "$summary" | jq -r '.testRunCoverage // empty')

          # Without a test run summary the CLI failed before any test ran, and the
          # reason is only in its error payload.
          cli_error=""
          if [[ $code -ne 0 && "$summary" == "{}" ]]; then
            cli_error=$(echo "$apex_result" | jq -r '.message // empty' 2>/dev/null || true)
          fi

          if [[ $code -eq 0 ]]; then
            echo "✅ Apex tests passed: ${apex_passing:-0} passing (coverage: ${apex_coverage:-n/a})"
          elif [[ "$cli_error" == "There are no Apex tests to run in this org." && "$apex_level" != "RunSpecifiedTests" ]]; then
            # An org without Apex tests has nothing to fail under a test level;
            # an explicit selection that runs nothing still fails below.
            echo "::notice::There are no Apex tests to run in this org - skipping the Apex tests."
            apex_outcome="Skipped"
          elif [[ -n "$cli_error" ]]; then
            echo "::error::Apex tests could not run: $cli_error"
            overall_exit=$code
          else
            echo "❌ Apex tests failed: ${apex_failing:-?} failing"
            overall_exit=$code
          fi
        fi

        # ----------------------------- LWC tests ------------------------------
        if [[ "$LWC" == "true" ]]; then
          echo "▶️ Running LWC (Jest) tests..."

          # Capture the Jest output so it can be folded into a collapsible group
          # on success; on failure it is printed unfolded so the failing tests
          # are visible without expanding anything.
          lwc_log="${RUNNER_TEMP:-/tmp}/sfdx-run-tests-lwc.log"
          bash -c "$LWC_TEST_COMMAND" >"$lwc_log" 2>&1 && code=0 || code=$?

          # Jest exits with 1 when it finds no test files at all (with 0 under
          # --passWithNoTests) and says so with this line. A project without
          # Jest tests has nothing to fail, so the LWC tests are skipped.
          lwc_no_tests=false
          if grep -q 'No tests found, exiting with code [01]' "$lwc_log"; then
            lwc_no_tests=true
          fi

          if [[ $code -eq 0 || "$lwc_no_tests" == "true" ]]; then
            echo "::group::LWC (Jest) test results"
            cat "$lwc_log"
            echo "::endgroup::"
          else
            cat "$lwc_log"
          fi

          # Derive overall line coverage from the lcov report (sum of hit/found lines).
          if [[ -f "$LWC_LCOV_PATH" ]]; then
            lwc_coverage=$(awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{ if (f>0) printf "%.1f%%", (h/f)*100 }' "$LWC_LCOV_PATH")
          fi

          if [[ "$lwc_no_tests" == "true" ]]; then
            echo "::notice::There are no LWC (Jest) tests in this project - skipping the LWC tests."
            lwc_outcome="Skipped"; lwc_coverage=""
          elif [[ $code -eq 0 ]]; then
            lwc_outcome="Passed"
            echo "✅ LWC tests passed (coverage: ${lwc_coverage:-n/a})"
          else
            lwc_outcome="Failed"
            echo "❌ LWC tests failed"
            overall_exit=$code
          fi
        fi

        # ----------------------------- Flow tests -----------------------------
        if [[ "$FLOW" == "true" ]]; then
          echo "▶️ Running Flow tests ($flow_level)..."

          # A flow without flow tests makes the org reject a flow-class-names
          # selection as a whole ("Invalid ID or name"), so the tests of the
          # other flows wouldn't run either. A flow doesn't need tests, so the
          # selected flows without a flow test in the project - a
          # *.flowtest-meta.xml naming the flow in <flowApiName> - are left out.
          flow_skip=false
          split_list "$FLOW_CLASS_NAMES"
          if [[ ${#SPLIT[@]} -gt 0 ]]; then
            tested_flows=$(find . -type f -not -path '*/node_modules/*' -name '*.flowtest-meta.xml' \
              -exec sed -n 's:.*<flowApiName>[[:space:]]*\([^<[:space:]]*\)[[:space:]]*</flowApiName>.*:\1:p' {} + | sort -u)
            flow_selection=(); untested=""
            for name in "${SPLIT[@]}"; do
              if grep -qixF -- "$name" <<< "$tested_flows"; then
                flow_selection+=(--class-names "$name")
              else
                untested+="${untested:+, }$name"
              fi
            done
            if [[ -n "$untested" ]]; then
              echo "::warning::No flow tests in this project for ${untested} - leaving them out. Check the flow API names in 'flow-class-names' if they should have some."
            fi
            if [[ ${#flow_selection[@]} -eq 0 ]]; then
              echo "::notice::None of the selected flows has flow tests - skipping the Flow tests."
              flow_outcome="Skipped"; flow_skip=true
            fi
          fi

          # Ensure the flow plugin is present before capturing any --json output
          # (its JIT install would otherwise leak npm noise onto stdout).
          if [[ "$flow_skip" == "true" ]]; then
            :
          elif ! ensure_flow; then
            overall_exit=1
          else
            # `sf flow run test` has no --wait flag; with --json it returns
            # immediately with only a testRunId (the run stays asynchronous).
            # Coverage/output-dir belong on `flow get test`, not `flow run test`.
            # So: kick off the run, then poll `flow get test` until it finishes.
            run_args=(--test-level "$flow_level")
            run_args+=(${flow_selection[@]+"${flow_selection[@]}"})
            [[ -n "$TARGET_ORG" ]] && run_args+=(--target-org "$TARGET_ORG")
            [[ -n "$API_VERSION" ]] && run_args+=(--api-version "$API_VERSION")

            run_output=$(sf flow run test "${run_args[@]}" --json) || true
            run_json=$(printf '%s\n' "$run_output" | extract_json)
            test_run_id=$(echo "$run_json" | jq -r '.result.testRunId // empty' 2>/dev/null)

            if [[ -z "$test_run_id" ]]; then
              # The run didn't start, and the reason is only in the CLI's error
              # payload. Under a test level, the org answers "No tests found for
              # category: flow" when it has no flow tests, which isn't a failure.
              # A selection the org can't run fails: its flows have tests in the
              # project, so these tests are missing in the org or misnamed.
              cli_error=$(echo "$run_json" | jq -r '.message // empty' 2>/dev/null || true)
              if [[ "$cli_error" == *"No tests found"* && "$flow_level" != "RunSpecifiedTests" ]]; then
                echo "::notice::There are no Flow tests to run in this org - skipping the Flow tests."
                flow_outcome="Skipped"
              else
                if [[ -z "$cli_error" ]]; then
                  echo "$run_output"
                fi
                echo "::error::Flow tests could not run: ${cli_error:-the CLI returned no test run ID}"
                overall_exit=1
              fi
            else
              get_args=(--test-run-id "$test_run_id" --output-dir "$FLOW_OUTPUT_DIR")
              [[ "$CODE_COVERAGE" == "true" ]] && get_args+=(--code-coverage)
              [[ -n "$TARGET_ORG" ]] && get_args+=(--target-org "$TARGET_ORG")

              # Poll until the async run finishes (bounded by the `wait` input, in minutes).
              deadline=$(( SECONDS + WAIT * 60 ))
              flow_result=""
              while :; do
                flow_result=$(sf flow get test "${get_args[@]}" --json) || true
                flow_result=$(printf '%s\n' "$flow_result" | extract_json)
                flow_outcome=$(echo "$flow_result" | jq -r '.result.summary.outcome // empty')
                [[ -n "$flow_outcome" && "$flow_outcome" != "InProgress" ]] && break
                [[ $SECONDS -ge $deadline ]] && break
                sleep 15
              done

              render_test_results "Flow test" "$flow_result"
              summary=$(echo "$flow_result" | jq '.result.summary // {}' 2>/dev/null)
              flow_outcome=$(echo "$summary" | jq -r '.outcome // empty')
              flow_coverage=$(echo "$summary" | jq -r '.testRunCoverage // empty')

              if [[ "$flow_outcome" == "Passed" ]]; then
                echo "✅ Flow tests passed (coverage: ${flow_coverage:-n/a})"
              else
                echo "❌ Flow tests failed"
                overall_exit=1
              fi
            fi
          fi
        fi

        # ----------------------------- Agent tests ----------------------------
        if [[ "$AGENT" == "true" ]]; then
          # Name and test runner of every test: the file type tells the runner, so
          # the CLI doesn't have to look it up (and can't find a name ambiguous).
          # A test named in `agent-tests` without a local file is left to the CLI.
          agent_names=(); agent_runners=()
          runner_of() {
            local file
            file="$(find . -type f -not -path '*/node_modules/*' \( -name "$1.aiEvaluationDefinition-meta.xml" -o -name "$1.aiTestingDefinition-meta.xml" \) | head -n1)"
            case "$file" in
              *.aiEvaluationDefinition-meta.xml) echo testing-center ;;
              *.aiTestingDefinition-meta.xml) echo agentforce-studio ;;
            esac
          }
          split_list "$AGENT_TESTS"
          if [[ ${#SPLIT[@]} -gt 0 ]]; then
            for name in "${SPLIT[@]}"; do
              agent_names+=("$name")
              agent_runners+=("$(runner_of "$name")")
            done
          else
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              name="$(basename "$file")"
              agent_names+=("${name%%.*}")
              case "$file" in
                *.aiEvaluationDefinition-meta.xml) agent_runners+=(testing-center) ;;
                *) agent_runners+=(agentforce-studio) ;;
              esac
            done < <(find . -type f -not -path '*/node_modules/*' \( -name '*.aiEvaluationDefinition-meta.xml' -o -name '*.aiTestingDefinition-meta.xml' \) | sort)
          fi

          if [[ ${#agent_names[@]} -eq 0 ]]; then
            echo "::notice::There are no agent tests in this project - skipping the agent tests."
            agent_outcome="Skipped"
          else
            agent_passed=0; agent_failed=0
            for i in "${!agent_names[@]}"; do
              name="${agent_names[$i]}"
              runner="${agent_runners[$i]}"
              echo "▶️ Running agent test $name..."
              agent_args=(--api-name "$name" --wait "$WAIT" --result-format junit --output-dir "$AGENT_OUTPUT_DIR")
              [[ -n "$runner" ]] && agent_args+=(--test-runner "$runner")
              [[ -n "$TARGET_ORG" ]] && agent_args+=(--target-org "$TARGET_ORG")
              [[ -n "$API_VERSION" ]] && agent_args+=(--api-version "$API_VERSION")

              agent_result=$(sf agent test run "${agent_args[@]}" --json 2>/dev/null) && code=0 || code=$?
              agent_result=$(printf '%s\n' "$agent_result" | extract_json)
              run_status=$(echo "$agent_result" | jq -r '.result.status // empty' 2>/dev/null)

              # A run that reached no result: the CLI failed before it finished, or
              # --wait ran out. The latter exits with 0, the run goes on in the org.
              if [[ "$run_status" != "COMPLETED" ]]; then
                if [[ "$run_status" == "IN_PROGRESS" || "$run_status" == "NEW" ]]; then
                  message="Still running after $WAIT minutes. Run ID: $(echo "$agent_result" | jq -r '.result.runId // "unknown"')"
                else
                  message=$(echo "$agent_result" | jq -r '.message // empty' 2>/dev/null)
                fi
                echo "::error::Agent test $name could not finish: ${message:-CLI exit code $code}"
                agent_failed=$(( agent_failed + 1 ))
                continue
              fi

              # The exit code can't tell whether a test passed: the CLI returns 0 for
              # failed expectations and only reports errors of the run itself. So
              # judge every test case by its results, the way the CLI's JUnit report
              # does. A metric without a verdict, like the latency, has result null.
              # Testing Center reports testResults, Agentforce Studio testScorerResults.
              verdict=$(echo "$agent_result" | jq -c '
                [(.result.testCases // []) | to_entries[] | .key as $i | .value
                 | { name: "Test case \(.testNumber // ($i + 1))\(if .inputs.utterance? then ": \(.inputs.utterance)" else "" end)" } as $case
                 | if has("testScorerResults") then
                     $case + { failures: (
                       if ((.testScorerResults // []) | length) == 0 then [{ name: "scorers", message: "No scorer results" }]
                       else [.testScorerResults[]
                             | .scorerName as $name | ((.scorerResponse | fromjson?) // {}) as $r
                             | select((($r.status // "") | ascii_upcase) != "PASS")
                             | { name: $name, expected: $r.expectedValue, actual: $r.actualValue, message: $r.reasoning }]
                       end) }
                   else
                     (.status // "") as $status
                     | $case + { failures: (
                         [(.testResults // [])[] | select(.result == "FAILURE" or .status == "ERROR")
                          | { name, expected: .expectedValue, actual: .actualValue, message: .errorMessage }]
                         + (if $status != "COMPLETED" and (([.testResults[]? | select(.result == "FAILURE" or .status == "ERROR")] | length) == 0)
                            then [{ name: "status", message: "Test case ended with status \($status)" }] else [] end)) }
                   end]' 2>/dev/null)
              [[ -n "$verdict" ]] || verdict="[]"

              echo "::group::Agent test $name results"
              echo "$verdict" | jq -r '.[] | if (.failures | length) == 0 then "✓ \(.name)" else "✗ \(.name)" end'
              echo "::endgroup::"
              echo "$verdict" | jq -r '
                .[] | .name as $case | .failures[]
                | "❌ \($case) - \(.name)"
                  + (if (.expected // "") != "" then "\n   expected: \(.expected)" else "" end)
                  + (if (.actual // "") != "" then "\n   actual:   \(.actual)" else "" end)
                  + (if (.message // "") != "" then "\n   \(.message)" else "" end)'

              total=$(echo "$verdict" | jq 'length')
              failing=$(echo "$verdict" | jq '[.[] | select((.failures | length) > 0)] | length')
              if [[ "$total" -gt 0 && "$failing" -eq 0 && $code -eq 0 ]]; then
                echo "✅ Agent test $name passed: $total test case(s)"
                agent_passed=$(( agent_passed + 1 ))
              else
                [[ "$total" -eq 0 ]] && echo "::error::Agent test $name returned no test cases."
                echo "❌ Agent test $name failed: $failing of $total test case(s)"
                agent_failed=$(( agent_failed + 1 ))
              fi
            done

            agent_detail="$agent_passed of $(( agent_passed + agent_failed )) tests passed"
            if [[ $agent_failed -eq 0 ]]; then
              agent_outcome="Passed"
            else
              agent_outcome="Failed"
              overall_exit=1
            fi
            echo "${agent_outcome}: ${agent_detail}"
          fi
        fi

        # ------------------------------- Outputs ------------------------------
        {
          echo "apex-outcome=${apex_outcome}"
          echo "apex-coverage=${apex_coverage}"
          echo "lwc-outcome=${lwc_outcome}"
          echo "lwc-coverage=${lwc_coverage}"
          echo "flow-outcome=${flow_outcome}"
          echo "flow-coverage=${flow_coverage}"
          echo "agent-outcome=${agent_outcome}"
        } >> "$GITHUB_OUTPUT"

        # ---------------------------- Step summary ----------------------------
        if [[ "$STEP_SUMMARY" == "true" ]]; then
          # Heading reflects the overall result; each row reflects its own outcome.
          [[ $overall_exit -eq 0 ]] && summary_icon="✅" || summary_icon="❌"
          {
            echo ""
            echo "### ${summary_icon} Test results"
            echo ""
            echo "| Test type | Outcome | Coverage |"
            echo "| --- | --- | --- |"
            if [[ "$APEX" == "true" ]]; then
              echo "| Apex | $(outcome_icon "$apex_outcome") ${apex_outcome:-n/a} | ${apex_coverage:-n/a} |"
            fi
            if [[ "$LWC" == "true" ]]; then
              echo "| LWC (Jest) | $(outcome_icon "$lwc_outcome") ${lwc_outcome:-n/a} | ${lwc_coverage:-n/a} |"
            fi
            if [[ "$FLOW" == "true" ]]; then
              echo "| Flow | $(outcome_icon "$flow_outcome") ${flow_outcome:-n/a} | ${flow_coverage:-n/a} |"
            fi
            if [[ "$AGENT" == "true" ]]; then
              echo "| Agent | $(outcome_icon "$agent_outcome") ${agent_outcome:-n/a}${agent_detail:+ ($agent_detail)} | n/a |"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $overall_exit
