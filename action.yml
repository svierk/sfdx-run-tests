name: SFDX Run Tests
description: GitHub composite action to run Salesforce Apex, LWC and Flow tests with code coverage reporting.

branding:
  icon: check-square
  color: blue

inputs:
  apex:
    description: Run Apex tests.
    required: false
    default: 'true'
  lwc:
    description: Run LWC (Jest) unit tests.
    required: false
    default: 'false'
  flow:
    description: Run Flow tests.
    required: false
    default: 'false'
  target-org:
    description: Username or alias of the target org (used for Apex and Flow tests). Not required if the default org is already set.
    required: false
  test-level:
    description: >
      Test level for Apex and Flow tests. Permissible values: RunLocalTests, RunAllTestsInOrg, RunSpecifiedTests.
      RunSpecifiedTests requires a test selection (see the apex-* and flow-* selection inputs). A test type with a
      selection always runs with RunSpecifiedTests, so a selection can be combined with another level for the other type.
    required: false
    default: RunLocalTests
  apex-class-names:
    description: >
      Apex test classes to run, as a comma-separated or multi-line list, e.g. "AccountServiceTest,LeadServiceTest".
      Runs all test methods of the given classes. Only one of apex-class-names, apex-suite-names or apex-tests can be set.
    required: false
  apex-suite-names:
    description: >
      Apex test suites to run, as a comma-separated or multi-line list, e.g. "SmokeTests".
      Only one of apex-class-names, apex-suite-names or apex-tests can be set.
    required: false
  apex-tests:
    description: >
      Apex tests to run, as a comma-separated or multi-line list of classes or Class.method names,
      e.g. "AccountServiceTest.testCreate,LeadServiceTest". Use ns.Class.method for namespaced tests.
      Only one of apex-class-names, apex-suite-names or apex-tests can be set.
    required: false
  flow-class-names:
    description: >
      Flows whose flow tests should run, as a comma-separated or multi-line list of flow API names, e.g. "Create_Case,Update_Account".
      Only one of flow-class-names or flow-tests can be set.
    required: false
  flow-tests:
    description: >
      Individual flow tests to run, as a comma-separated or multi-line list of FlowName.TestName entries,
      e.g. "Create_Case.Happy_Path". Only one of flow-class-names or flow-tests can be set.
    required: false
  code-coverage:
    description: Collect code coverage for Apex and Flow tests.
    required: false
    default: 'true'
  apex-output-dir:
    description: Directory for Apex test result and coverage files. Contains test-result-codecoverage.json for Sonar.
    required: false
    default: ./tests/apex
  flow-output-dir:
    description: Directory for Flow test result and coverage files.
    required: false
    default: ./tests/flow
  lwc-test-command:
    description: >
      Command used to run the LWC Jest tests with coverage (must write an lcov report).
      Defaults to invoking sfdx-lwc-jest directly so it works on any SFDX project without
      relying on a specific package.json script. Override it to use your own test script,
      e.g. "npm run test:unit:coverage".
    required: false
    default: npx sfdx-lwc-jest --coverage
  lwc-lcov-path:
    description: Path to the lcov report produced by the LWC tests, used to report overall coverage.
    required: false
    default: ./coverage/lcov.info
  wait:
    description: Number of minutes to wait for the Apex and Flow test runs to complete.
    required: false
    default: '33'
  api-version:
    description: Override the api version used for Apex and Flow test api requests, for example '59.0'.
    required: false
  step-summary:
    description: Write a result section to the GitHub Actions job summary. Set to false to avoid collisions with a custom workflow summary.
    required: false
    default: 'true'

outputs:
  apex-outcome:
    description: Outcome of the Apex test run ("Passed"/"Failed"), empty if not run.
    value: ${{ steps.tests.outputs.apex-outcome }}
  apex-coverage:
    description: Overall Apex code coverage, empty if not run.
    value: ${{ steps.tests.outputs.apex-coverage }}
  lwc-outcome:
    description: Outcome of the LWC test run ("Passed"/"Failed"), empty if not run.
    value: ${{ steps.tests.outputs.lwc-outcome }}
  lwc-coverage:
    description: Overall LWC line coverage, empty if not run.
    value: ${{ steps.tests.outputs.lwc-coverage }}
  flow-outcome:
    description: Outcome of the Flow test run ("Passed"/"Failed"), empty if not run.
    value: ${{ steps.tests.outputs.flow-outcome }}
  flow-coverage:
    description: Overall Flow code coverage, empty if not run.
    value: ${{ steps.tests.outputs.flow-coverage }}

runs:
  using: composite
  steps:
    - name: Run Tests
      id: tests
      shell: bash
      env:
        APEX: ${{ inputs.apex }}
        LWC: ${{ inputs.lwc }}
        FLOW: ${{ inputs.flow }}
        TARGET_ORG: ${{ inputs.target-org }}
        TEST_LEVEL: ${{ inputs.test-level }}
        APEX_CLASS_NAMES: ${{ inputs.apex-class-names }}
        APEX_SUITE_NAMES: ${{ inputs.apex-suite-names }}
        APEX_TESTS: ${{ inputs.apex-tests }}
        FLOW_CLASS_NAMES: ${{ inputs.flow-class-names }}
        FLOW_TESTS: ${{ inputs.flow-tests }}
        CODE_COVERAGE: ${{ inputs.code-coverage }}
        APEX_OUTPUT_DIR: ${{ inputs.apex-output-dir }}
        FLOW_OUTPUT_DIR: ${{ inputs.flow-output-dir }}
        LWC_TEST_COMMAND: ${{ inputs.lwc-test-command }}
        LWC_LCOV_PATH: ${{ inputs.lwc-lcov-path }}
        WAIT: ${{ inputs.wait }}
        API_VERSION: ${{ inputs.api-version }}
        STEP_SUMMARY: ${{ inputs.step-summary }}
      run: |
        set -uo pipefail

        # We manage the exit status ourselves via `overall_exit`, so disable
        # errexit (GitHub runs composite shells with `-e` by default). This
        # guarantees that a failure in one test type still lets the remaining
        # types run and the job summary render before we exit with the
        # aggregated status.
        set +e

        overall_exit=0

        # Extract the JSON object from CLI output that may be prefixed with
        # npm/plugin JIT-install noise (some of which contains "{"). Keeps
        # everything from the first line that starts with "{".
        extract_json() { awk '/^[[:space:]]*\{/{f=1} f'; }

        # Splits a comma- or newline-separated input into the global SPLIT array
        # and trims the surrounding whitespace, so that both notations work:
        #   apex-tests: 'AccountServiceTest,LeadServiceTest'
        #   apex-tests: |
        #     AccountServiceTest
        #     LeadServiceTest
        split_list() {
          SPLIT=()
          local raw item
          raw="${1//,/$'\n'}"
          while IFS= read -r item; do
            item="${item#"${item%%[![:space:]]*}"}"
            item="${item%"${item##*[![:space:]]}"}"
            if [[ -n "$item" ]]; then
              SPLIT+=("$item")
            fi
          done <<< "$raw"
        }

        # Builds the test selection of one test type from its list inputs: fills
        # the global SELECTION array with one CLI flag per value and sets
        # SELECTION_LEVEL to the test level to run with. A selection implies
        # RunSpecifiedTests; without one, the `test-level` input applies.
        # Returns 1 (after logging the reason) if more than one selection input
        # is set - the CLI accepts only one kind - or if RunSpecifiedTests is
        # requested without any selection.
        # Usage: select_tests "<label>" "<input>" "<flag>" "<value>" [...]
        select_tests() {
          local label="$1" inputs="" used="" count=0 item
          shift
          SELECTION=()
          SELECTION_LEVEL="$TEST_LEVEL"
          while [[ $# -ge 3 ]]; do
            inputs+="${inputs:+, }'$1'"
            split_list "$3"
            if [[ ${#SPLIT[@]} -gt 0 ]]; then
              count=$(( count + 1 ))
              used+="${used:+, }'$1'"
              for item in "${SPLIT[@]}"; do
                SELECTION+=("$2" "$item")
              done
            fi
            shift 3
          done

          if [[ $count -gt 1 ]]; then
            echo "::error::${label} test selection is ambiguous: ${used} are set, but only one of them can be used."
            return 1
          fi
          if [[ $count -eq 1 ]]; then
            SELECTION_LEVEL=RunSpecifiedTests
          elif [[ "$TEST_LEVEL" == "RunSpecifiedTests" ]]; then
            echo "::error::Test level RunSpecifiedTests needs a selection of the ${label} tests to run. Set one of ${inputs}."
            return 1
          fi
        }

        # Map a test outcome to a status icon for the job summary. Anything other
        # than a clean "Passed" (including an empty outcome from a run that never
        # completed) is treated as not-passing.
        outcome_icon() {
          case "$1" in
            Passed) printf '✅' ;;
            Failed) printf '❌' ;;
            *)      printf '⚠️' ;;
          esac
        }

        # Make sure the flow plugin (used to run Flow tests) is available. It is
        # a JIT plugin whose first-use install dumps npm warnings onto stdout;
        # installing it up front keeps that noise out of the captured JSON. If a
        # previous step already installed it, the check skips reinstalling. The
        # install output is captured and only surfaced on failure to keep the
        # log clean. `flow` also appears under "Uninstalled JIT Plugins:", so
        # only the installed section (above that header) is inspected.
        ensure_flow() {
          if sf plugins 2>/dev/null | sed '/Uninstalled JIT Plugins:/,$d' | grep -q '^flow '; then
            return 0
          fi
          echo "Installing flow plugin..."
          local log
          if ! log="$(sf plugins install flow 2>&1)"; then
            echo "$log"
            echo "::error::Failed to install the flow plugin."
            return 1
          fi
        }

        # Render an `sf ... test --json` payload the way Jest reports its runs:
        # a collapsible log group with one line per test plus a readable run
        # summary. Any failures are repeated OUTSIDE the group (with message and
        # stack trace) so they are visible without expanding anything.
        # Usage: render_test_results "<label>" "<json>"
        render_test_results() {
          local label="$1" json="$2"

          if ! echo "$json" | jq -e . >/dev/null 2>&1; then
            echo "⚠️ ${label}: the CLI returned unexpected non-JSON output:"
            echo "$json"
            return 0
          fi

          echo "::group::${label} results"
          echo "$json" | jq -r '
            def name: .FullName // "\(.ApexClass.Name // "?").\(.MethodName // "?")";
            (.result.tests // []) as $t
            | (if ($t | length) == 0 then ["(no individual test results returned)"]
               else [$t[]
                     | if .Outcome == "Pass" then "✓ \(name) (\(.RunTime // 0) ms)"
                       elif .Outcome == "Skip" then "○ \(name) (skipped)"
                       else "✗ \(name) (\(.RunTime // 0) ms)"
                       end]
               end)
            + ["",
               (.result.summary // {}
                | "Outcome:            \(.outcome // "-")",
                  "Tests ran:          \(.testsRan // "-")",
                  "Passing:            \(.passing // 0)",
                  "Failing:            \(.failing // 0)",
                  "Skipped:            \(.skipped // 0)",
                  "Pass rate:          \(.passRate // "-")",
                  "Run time:           \(.testExecutionTime // "-")",
                  "Org-wide coverage:  \(.orgWideCoverage // "-")",
                  "Test run coverage:  \(.testRunCoverage // "-")",
                  "Test run ID:        \(.testRunId // "-")",
                  "Org:                \(.hostname // "-")",
                  "Username:           \(.username // "-")")]
            | .[]'
          echo "::endgroup::"

          echo "$json" | jq -r '
            def name: .FullName // "\(.ApexClass.Name // "?").\(.MethodName // "?")";
            (.result.tests // [])
            | map(select(.Outcome != "Pass" and .Outcome != "Skip"))
            | .[]
            | "❌ \(name): \((.Message // "Test failed") | gsub("\n"; " "))"
              + (if (.StackTrace // "") != "" then "\n   \(.StackTrace | gsub("\n"; "\n   "))" else "" end)'
        }

        apex_outcome=""; apex_coverage=""; apex_passing=""; apex_failing=""
        lwc_outcome=""; lwc_coverage=""
        flow_outcome=""; flow_coverage=""

        # --------------------------- Test selection ---------------------------
        # Resolve the selection of every enabled test type up front, so that a
        # misconfiguration fails fast instead of after a long Apex test run.
        selection_ok=true
        apex_selection=(); apex_level="$TEST_LEVEL"
        flow_selection=(); flow_level="$TEST_LEVEL"
        if [[ "$APEX" == "true" ]]; then
          if select_tests "Apex" \
            apex-class-names --class-names "$APEX_CLASS_NAMES" \
            apex-suite-names --suite-names "$APEX_SUITE_NAMES" \
            apex-tests --tests "$APEX_TESTS"; then
            apex_selection=(${SELECTION[@]+"${SELECTION[@]}"})
            apex_level="$SELECTION_LEVEL"
          else
            selection_ok=false
          fi
        fi
        if [[ "$FLOW" == "true" ]]; then
          if select_tests "Flow" \
            flow-class-names --class-names "$FLOW_CLASS_NAMES" \
            flow-tests --tests "$FLOW_TESTS"; then
            flow_selection=(${SELECTION[@]+"${SELECTION[@]}"})
            flow_level="$SELECTION_LEVEL"
          else
            selection_ok=false
          fi
        fi
        [[ "$selection_ok" == "true" ]] || exit 1

        # ----------------------------- Apex tests -----------------------------
        if [[ "$APEX" == "true" ]]; then
          echo "▶️ Running Apex tests ($apex_level)..."
          apex_args=(--test-level "$apex_level" --output-dir "$APEX_OUTPUT_DIR" --wait "$WAIT")
          apex_args+=(${apex_selection[@]+"${apex_selection[@]}"})
          [[ "$CODE_COVERAGE" == "true" ]] && apex_args+=(--code-coverage)
          [[ -n "$TARGET_ORG" ]] && apex_args+=(--target-org "$TARGET_ORG")
          [[ -n "$API_VERSION" ]] && apex_args+=(--api-version "$API_VERSION")

          # Capture the CLI exit code explicitly (non-zero means the run reported
          # test failures) so we can record it and still continue to the summary.
          apex_result=$(sf apex run test "${apex_args[@]}" --json) && code=0 || code=$?
          apex_result=$(printf '%s\n' "$apex_result" | extract_json)
          render_test_results "Apex test" "$apex_result"

          summary=$(echo "$apex_result" | jq '.result.summary // {}' 2>/dev/null)
          apex_outcome=$(echo "$summary" | jq -r '.outcome // empty')
          apex_passing=$(echo "$summary" | jq -r '.passing // empty')
          apex_failing=$(echo "$summary" | jq -r '.failing // empty')
          apex_coverage=$(echo "$summary" | jq -r '.testRunCoverage // empty')

          if [[ $code -eq 0 ]]; then
            echo "✅ Apex tests passed: ${apex_passing:-0} passing (coverage: ${apex_coverage:-n/a})"
          else
            echo "❌ Apex tests failed: ${apex_failing:-?} failing"
            overall_exit=$code
          fi
        fi

        # ----------------------------- LWC tests ------------------------------
        if [[ "$LWC" == "true" ]]; then
          echo "▶️ Running LWC (Jest) tests..."

          # Capture the Jest output so it can be folded into a collapsible group
          # on success; on failure it is printed unfolded so the failing tests
          # are visible without expanding anything.
          lwc_log="${RUNNER_TEMP:-/tmp}/sfdx-run-tests-lwc.log"
          bash -c "$LWC_TEST_COMMAND" >"$lwc_log" 2>&1 && code=0 || code=$?

          if [[ $code -eq 0 ]]; then
            echo "::group::LWC (Jest) test results"
            cat "$lwc_log"
            echo "::endgroup::"
          else
            cat "$lwc_log"
          fi

          # Derive overall line coverage from the lcov report (sum of hit/found lines).
          if [[ -f "$LWC_LCOV_PATH" ]]; then
            lwc_coverage=$(awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{ if (f>0) printf "%.1f%%", (h/f)*100 }' "$LWC_LCOV_PATH")
          fi

          if [[ $code -eq 0 ]]; then
            lwc_outcome="Passed"
            echo "✅ LWC tests passed (coverage: ${lwc_coverage:-n/a})"
          else
            lwc_outcome="Failed"
            echo "❌ LWC tests failed"
            overall_exit=$code
          fi
        fi

        # ----------------------------- Flow tests -----------------------------
        if [[ "$FLOW" == "true" ]]; then
          echo "▶️ Running Flow tests ($flow_level)..."

          # Ensure the flow plugin is present before capturing any --json output
          # (its JIT install would otherwise leak npm noise onto stdout).
          if ! ensure_flow; then
            overall_exit=1
          else
            # `sf flow run test` has no --wait flag; with --json it returns
            # immediately with only a testRunId (the run stays asynchronous).
            # Coverage/output-dir belong on `flow get test`, not `flow run test`.
            # So: kick off the run, then poll `flow get test` until it finishes.
            run_args=(--test-level "$flow_level")
            run_args+=(${flow_selection[@]+"${flow_selection[@]}"})
            [[ -n "$TARGET_ORG" ]] && run_args+=(--target-org "$TARGET_ORG")
            [[ -n "$API_VERSION" ]] && run_args+=(--api-version "$API_VERSION")

            run_json=$(sf flow run test "${run_args[@]}" --json) || true
            run_json=$(printf '%s\n' "$run_json" | extract_json)
            test_run_id=$(echo "$run_json" | jq -r '.result.testRunId // empty')

            if [[ -z "$test_run_id" ]]; then
              echo "❌ Could not start Flow test run"
              echo "$run_json" | jq '.'
              overall_exit=1
            else
              get_args=(--test-run-id "$test_run_id" --output-dir "$FLOW_OUTPUT_DIR")
              [[ "$CODE_COVERAGE" == "true" ]] && get_args+=(--code-coverage)
              [[ -n "$TARGET_ORG" ]] && get_args+=(--target-org "$TARGET_ORG")

              # Poll until the async run finishes (bounded by the `wait` input, in minutes).
              deadline=$(( SECONDS + WAIT * 60 ))
              flow_result=""
              while :; do
                flow_result=$(sf flow get test "${get_args[@]}" --json) || true
                flow_result=$(printf '%s\n' "$flow_result" | extract_json)
                flow_outcome=$(echo "$flow_result" | jq -r '.result.summary.outcome // empty')
                [[ -n "$flow_outcome" && "$flow_outcome" != "InProgress" ]] && break
                [[ $SECONDS -ge $deadline ]] && break
                sleep 15
              done

              render_test_results "Flow test" "$flow_result"
              summary=$(echo "$flow_result" | jq '.result.summary // {}' 2>/dev/null)
              flow_outcome=$(echo "$summary" | jq -r '.outcome // empty')
              flow_coverage=$(echo "$summary" | jq -r '.testRunCoverage // empty')

              if [[ "$flow_outcome" == "Passed" ]]; then
                echo "✅ Flow tests passed (coverage: ${flow_coverage:-n/a})"
              else
                echo "❌ Flow tests failed"
                overall_exit=1
              fi
            fi
          fi
        fi

        # ------------------------------- Outputs ------------------------------
        {
          echo "apex-outcome=${apex_outcome}"
          echo "apex-coverage=${apex_coverage}"
          echo "lwc-outcome=${lwc_outcome}"
          echo "lwc-coverage=${lwc_coverage}"
          echo "flow-outcome=${flow_outcome}"
          echo "flow-coverage=${flow_coverage}"
        } >> "$GITHUB_OUTPUT"

        # ---------------------------- Step summary ----------------------------
        if [[ "$STEP_SUMMARY" == "true" ]]; then
          # Heading reflects the overall result; each row reflects its own outcome.
          [[ $overall_exit -eq 0 ]] && summary_icon="✅" || summary_icon="❌"
          {
            echo ""
            echo "### ${summary_icon} Test results"
            echo ""
            echo "| Test type | Outcome | Coverage |"
            echo "| --- | --- | --- |"
            if [[ "$APEX" == "true" ]]; then
              echo "| Apex | $(outcome_icon "$apex_outcome") ${apex_outcome:-n/a} | ${apex_coverage:-n/a} |"
            fi
            if [[ "$LWC" == "true" ]]; then
              echo "| LWC (Jest) | $(outcome_icon "$lwc_outcome") ${lwc_outcome:-n/a} | ${lwc_coverage:-n/a} |"
            fi
            if [[ "$FLOW" == "true" ]]; then
              echo "| Flow | $(outcome_icon "$flow_outcome") ${flow_outcome:-n/a} | ${flow_coverage:-n/a} |"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $overall_exit
